<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/css/form.css">
  <style>
    .error { color: red; font-size: 13px; }
  </style>
</head>
<body>
  <form action="/user/login" method="post">
  <div class="form-container">
    <h1>Login</h1>

    <div class="registration-form">
      <label><b>User Name</b><span class="required">*</span></label>
      <input type="text" id="userName" name="userName">
      <span class="error" id="username-error"></span>
    </div>

    <div class="registration-form">
      <label><b>Password</b><span class="required">*</span></label>
      <input type="password" id="password" name="pwd">
      <span class="error" id="password-error"></span>
    </div>

    <span class="error" id="login-error"></span>
    <p><b>Don't have an account? <a href="/register">Create one now.</b></a></p>

    <div class="SubmitCancel">
      <button type="reset" class="cancelbtn"><b>Cancel</b></button>
      <button type="submit" class="submitbtn"><b>Submit</b></button>
    </div>
  </div>
  </form>
</body>
</html>
